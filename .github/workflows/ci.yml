name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ind tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          cd smart-split-bill-be
          pip install -r requirements.txt

      - name: Run Backend Tests
        run: |
          cd smart-split-bill-be
          python -m tests.test_parser
          python -m tests.test_api

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: smart-split-bill-fe/package-lock.json

      - name: Install dependencies
        run: |
          cd smart-split-bill-fe
          npm ci

      - name: Type Check & Build
        run: |
          cd smart-split-bill-fe
          npm run build

